# GitHub Actions workflow: production-деплой на GitHub Pages.
#
# Используется как штатный production-деплой проекта:
#   • сборка статического сайта SvelteKit (adapter-static → build/);
#   • публикация GitHub Pages через официальный artifact-based flow.
#
# Ветки:
#   • source: `svelte-next`;
#   • production: `main`.
#
# Модель — официальная artifact-based для GitHub Pages:
#   configure-pages → checkout → setup-node → npm ci → npm run build
#   → upload-pages-artifact(build) → deploy-pages.
# Отдельная ветка сборки (gh-pages) НЕ используется.
#
# Почему без `static_site_generator: sveltekit`:
#   base path уже зафиксирован статически в vite.config.js (`paths.base =
#   '/InfiniteToday'`), а `.nojekyll` лежит в static/ и попадает в build/.
#   `static_site_generator` нужен, чтобы подставить BASE_PATH в конфиг,
#   который сам вычисляет base; нам это не нужно и не должно переписывать output.

name: Deploy to GitHub Pages

on:
  # Ручной запуск production-деплоя.
  workflow_dispatch:
  # Push-триггер source-ветки (при необходимости включить):
  # push:
  #   branches:
  #     - svelte-next

# Минимально необходимые права: чтение исходников, запись в Pages,
# OIDC-токен для actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Не допускаем параллельных deployment; начатый production-деплой не отменяем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # SvelteKit 3 требует Node >= 22.17; проект проверен на Node 24.x.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (adapter-static → build/)
        run: npm run build

      - name: Upload Pages artifact (только build/)
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
